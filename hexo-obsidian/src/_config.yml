# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Zeek Zhao的知识管理平台
subtitle: '基于Obsidian的知识管理平台'
description: '使用Hexo构建的个人知识库网站'
keywords: 知识管理, Obsidian, Hexo, 笔记, 学习
author: Zeek Zhao
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://zeek-zhao.github.io
#permalink: :year/:month/:day/:title/
# hexo-abbrlink
permalink: p/:abbrlink/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
  exclude_languages: ['mermaid']
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''
  exclude_languages: ['mermaid']

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:zeek-zhao/zeek-zhao.github.io.git  # 移除令牌，使用环境变量
  branch: main

# 搜索功能
search:
  path: search.xml
  field: post
  content: true
  template: ./search.xml



# 字数统计
symbols_count_time:
  symbols: true
  time: true
  total_symbols: true
  total_time: true

# Obsidian集成设置
obsidian:
  enable: true
  convertWikiLinks: true
  handleEmbeds: true
  parseCallouts: true


# Live2D
live2d:
    enable: true
    scriptFrom: local
    model: 
        use: live2d-widget-model-miku #模型选择
    display: 
        position: right  #模型位置
        width: 300       #模型宽度
        height: 400      #模型高度
    mobile: 
        show: false      #是否在手机端显示

kramed:
  gfm: true
  pedantic: false
  sanitize: false
  tables: true
  breaks: true
  smartLists: true
  smartypants: true

aplayer:
  meting: true
  asset_inject: false

# Obsidian Internal links 双向链接渲染解决方案
# hexo-filter-titlebased-link
# https://github.com/uuanqin/hexo-filter-titlebased-link
titlebased_link:
  enable: true   # enable this plugin

# markdown_it_plus 语法渲染插件选项
markdown_it_plus:
  plugins:
    # 任务列表语法 - [ ]  /  - [ x ]
    - plugin:
        enable: true
        name: markdown-it-task-lists
        options:
        # this is plugin option
    # Obsidian Callouts
    - plugin:
        enable: true
        name: mdit-plugin-callouts


# Security
encrypt: # hexo-blog-encrypt
  silent: true
  abstract: 有东西被加密了, 请输入密码查看.
  message: 您好, 这里需要密码.
  tags:
  - {name: Butterfly, password: Butterfly}
  - {name: Obsidian, password: Obsidian}
  - {name: yocto, password: yocto}
  wrong_pass_message: 抱歉, 这个密码看着不太对, 请再试试.
  wrong_hash_message: 抱歉, 这个文章不能被校验, 不过您还是能看看解密后的内容.
